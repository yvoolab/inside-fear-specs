<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830">
<style>
 text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #3d302b; font-size: 17px; }
 .title { font-size: 26px; font-weight: 700; }
 .cap { font-size: 15px; font-style: italic; fill: #6b5d57; }
 .lobe { font-size: 19px; font-weight: 600; fill: #2c2522; opacity: .75; }
 .key { font-weight: 700; fill: #a8410a; font-size: 19px; }
 .small { font-size: 14px; fill: #6b5d57; }
 .lead { stroke: #3d302b; stroke-width: 1.1; fill: none; }
 .keylead { stroke: #a8410a; stroke-width: 1.8; fill: none; }
 .ol { stroke: #3d302b; stroke-width: 2.5; stroke-linejoin: round; }
 .sul { stroke: #5a4842; stroke-width: 1.6; fill: none; opacity: .55; stroke-linecap: round; }
</style>
<defs>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
 <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4361b"/></marker>
 <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d302b"/></marker>
</defs>
<rect width="1400" height="830" fill="#fdfbf7"/><text x="40" y="44" class="title" text-anchor="start"><tspan x="40" dy="0em">Figure 2 · The amygdala up close — its nuclei and the fear circuit</tspan></text><text x="40" y="72" class="cap" text-anchor="start"><tspan x="40" dy="0em">Left amygdala, front (coronal) view. Each side of the brain has one, about the size of an almond (~1.5 cm).</tspan></text><g transform="translate(700,440)"><clipPath id="alm"><path d="M-260,40 C-220,-150 120,-200 250,-60 C290,-10 250,90 150,150 C20,220 -230,190 -260,40 Z"/></clipPath><path d="M-260,40 C-220,-150 120,-200 250,-60 C290,-10 250,90 150,150 C20,220 -230,190 -260,40 Z" fill="#ff7a1a" filter="url(#glow)" opacity=".55"/><g clip-path="url(#alm)"><polygon points="-300,-250 -40,-250 -60,-60 -130,40 -300,40" fill="#ffb36b" stroke="#a8410a" stroke-width="1.6" stroke-linejoin="round"/><polygon points="-300,40 -130,40 -60,-60 20,40 -20,260 -300,260" fill="#ff9a45" stroke="#a8410a" stroke-width="1.6" stroke-linejoin="round"/><polygon points="-60,-60 120,-20 110,80 150,260 -20,260 20,40" fill="#ffc995" stroke="#a8410a" stroke-width="1.6" stroke-linejoin="round"/><polygon points="-40,-250 400,-250 400,-30 120,-20 -60,-60" fill="#e2581a" stroke="#a8410a" stroke-width="1.6" stroke-linejoin="round"/><polygon points="120,-20 400,-30 400,260 150,260 110,80" fill="#f6a98c" stroke="#a8410a" stroke-width="1.6" stroke-linejoin="round"/></g><path d="M-260,40 C-220,-150 120,-200 250,-60 C290,-10 250,90 150,150 C20,220 -230,190 -260,40 Z" fill="none" stroke="#a8410a" stroke-width="3"/><text style="font-weight:600;font-size:17px" x="-165" y="-45" class="" text-anchor="middle"><tspan x="-165" dy="0em">Lateral</tspan><tspan x="-165" dy="1.15em">nucleus (LA)</tspan></text><text style="font-weight:600;font-size:17px" x="-140" y="85" class="" text-anchor="middle"><tspan x="-140" dy="0em">Basal</tspan><tspan x="-140" dy="1.15em">nucleus (BA)</tspan></text><text style="font-weight:600;font-size:17px" x="50" y="70" class="" text-anchor="middle"><tspan x="50" dy="0em">Accessory</tspan><tspan x="50" dy="1.15em">basal (AB)</tspan></text><text style="font-weight:600;font-size:17px" x="95" y="-95" class="" text-anchor="middle"><tspan x="95" dy="0em">Central</tspan><tspan x="95" dy="1.15em">nucleus (CeA)</tspan></text><text style="font-weight:600;font-size:17px" x="195" y="15" class="" text-anchor="middle"><tspan x="195" dy="0em">Medial</tspan><tspan x="195" dy="1.15em">nucleus</tspan><tspan x="195" dy="1.15em">(MeA)</tspan></text><path d="M-160,5 C-165,25 -160,40 -150,52" stroke="#3d302b" stroke-width="2" fill="none" marker-end="url(#arrK)"/><path d="M-100,-95 C-60,-130 0,-130 40,-118" stroke="#3d302b" stroke-width="2" fill="none" marker-end="url(#arrK)"/><path d="M-80,60 C-40,20 0,-20 40,-55" stroke="#3d302b" stroke-width="2" fill="none" marker-end="url(#arrK)"/></g><rect x="40" y="150" width="260" height="66" rx="10" fill="#fff" stroke="#2f6db5" stroke-width="2.2"/><text style="font-weight:700" x="170.0" y="178" class="" text-anchor="middle"><tspan x="170.0" dy="0em">Sensory thalamus</tspan></text><text x="170.0" y="200" class="small" text-anchor="middle"><tspan x="170.0" dy="0em">fast, rough “low road”</tspan></text><rect x="40" y="300" width="260" height="66" rx="10" fill="#fff" stroke="#2f6db5" stroke-width="2.2"/><text style="font-weight:700" x="170.0" y="328" class="" text-anchor="middle"><tspan x="170.0" dy="0em">Sensory cortex</tspan></text><text x="170.0" y="350" class="small" text-anchor="middle"><tspan x="170.0" dy="0em">slower, detailed “high road”</tspan></text><rect x="40" y="620" width="260" height="66" rx="10" fill="#fff" stroke="#2f6db5" stroke-width="2.2"/><text style="font-weight:700" x="170.0" y="648" class="" text-anchor="middle"><tspan x="170.0" dy="0em">Hippocampus</tspan></text><text x="170.0" y="670" class="small" text-anchor="middle"><tspan x="170.0" dy="0em">context: where &amp; when</tspan></text><rect x="560" y="100" width="280" height="66" rx="10" fill="#fff" stroke="#6d5a88" stroke-width="2.2"/><text style="font-weight:700" x="700.0" y="128" class="" text-anchor="middle"><tspan x="700.0" dy="0em">Prefrontal cortex</tspan></text><text x="700.0" y="150" class="small" text-anchor="middle"><tspan x="700.0" dy="0em">top-down regulation, extinction</tspan></text><rect x="1100" y="130" width="270" height="66" rx="10" fill="#fff" stroke="#c4361b" stroke-width="2.2"/><text style="font-weight:700" x="1235.0" y="158" class="" text-anchor="middle"><tspan x="1235.0" dy="0em">Hypothalamus</tspan></text><text x="1235.0" y="180" class="small" text-anchor="middle"><tspan x="1235.0" dy="0em">stress hormones (cortisol)</tspan></text><rect x="1100" y="290" width="270" height="66" rx="10" fill="#fff" stroke="#c4361b" stroke-width="2.2"/><text style="font-weight:700" x="1235.0" y="318" class="" text-anchor="middle"><tspan x="1235.0" dy="0em">Periaqueductal gray</tspan></text><text x="1235.0" y="340" class="small" text-anchor="middle"><tspan x="1235.0" dy="0em">freezing</tspan></text><rect x="1100" y="450" width="270" height="66" rx="10" fill="#fff" stroke="#c4361b" stroke-width="2.2"/><text style="font-weight:700" x="1235.0" y="478" class="" text-anchor="middle"><tspan x="1235.0" dy="0em">Brainstem nuclei</tspan></text><text x="1235.0" y="500" class="small" text-anchor="middle"><tspan x="1235.0" dy="0em">heart rate ↑ · breathing ↑ · startle</tspan></text><path d="M300,183 C400,190 450,300 505,365" stroke="#2f6db5" stroke-width="3" fill="none" marker-end="url(#arrB)"/><path d="M300,333 C380,338 430,360 500,390" stroke="#2f6db5" stroke-width="3" fill="none" marker-end="url(#arrB)"/><path d="M300,653 C420,650 500,600 545,548" stroke="#2f6db5" stroke-width="3" fill="none" marker-end="url(#arrB)"/><path d="M700,168 L700,292" stroke="#6d5a88" stroke-width="3" fill="none" marker-start="url(#arrK)" marker-end="url(#arrK)"/><path d="M885,335 C960,300 1000,180 1098,165" stroke="#c4361b" stroke-width="3" fill="none" marker-end="url(#arrR)"/><path d="M905,370 C980,350 1020,325 1098,323" stroke="#c4361b" stroke-width="3" fill="none" marker-end="url(#arrR)"/><path d="M895,405 C980,420 1020,470 1098,482" stroke="#c4361b" stroke-width="3" fill="none" marker-end="url(#arrR)"/><text x="700" y="660" class="small" text-anchor="middle"><tspan x="700" dy="0em">Fear learning: a tone/sight (LA) paired with danger → CeA drives the body’s fear response</tspan></text><text x="350" y="566" class="small" text-anchor="middle"><tspan x="350" dy="0em">lateral</tspan></text><text x="1015" y="566" class="small" text-anchor="middle"><tspan x="1015" dy="0em">medial</tspan></text><path d="M385,561 L430,561" stroke="#6b5d57" stroke-width="1.2" marker-start="url(#arrK)"/><path d="M925,561 L970,561" stroke="#6b5d57" stroke-width="1.2" marker-end="url(#arrK)"/><path d="M1100,640 L1150,640" stroke="#2f6db5" stroke-width="3" marker-end="url(#arrB)"/><text x="1160" y="646" class="" text-anchor="start"><tspan x="1160" dy="0em">input to amygdala</tspan></text><path d="M1100,675 L1150,675" stroke="#c4361b" stroke-width="3" marker-end="url(#arrR)"/><text x="1160" y="681" class="" text-anchor="start"><tspan x="1160" dy="0em">output from amygdala</tspan></text><path d="M1100,710 L1150,710" stroke="#3d302b" stroke-width="2" marker-end="url(#arrK)"/><text x="1160" y="716" class="" text-anchor="start"><tspan x="1160" dy="0em">flow inside amygdala</tspan></text><g transform="translate(400,700) scale(0.17)"><clipPath id="brainclip"><path d="M140,330 C90,280 95,170 170,120 C250,60 420,50 530,80 C640,110 710,200 700,300 C695,340 670,370 630,375 L560,380 C520,420 470,440 420,445 C340,452 262,442 236,402 C222,378 228,352 250,342 C215,350 170,348 140,330 Z"/></clipPath><path class="ol" fill="#e6d3b8" d="M455,385 C450,430 440,470 450,520 L455,575 L503,575 L506,520 C518,470 515,420 505,385 Z"/><ellipse class="ol" cx="468" cy="448" rx="30" ry="34" fill="#e6d3b8"/><clipPath id="cbclip"><ellipse cx="605" cy="447" rx="90" ry="58"/></clipPath><ellipse class="ol" cx="605" cy="447" rx="90" ry="58" fill="#dccbea"/><g clip-path="url(#brainclip)"><polygon points="0,0 445,0 440,62 380,295 250,342 0,420" fill="#a9c8ea"/><polygon points="445,0 605,0 600,92 610,300 480,262 380,295 440,62" fill="#f5e19a"/><polygon points="605,0 820,0 820,520 622,380 610,300 600,92" fill="#f3c0cc"/><polygon points="250,342 380,295 480,262 610,300 622,380 600,520 180,520" fill="#c6e3b4"/></g><path class="ol" fill="none" d="M140,330 C90,280 95,170 170,120 C250,60 420,50 530,80 C640,110 710,200 700,300 C695,340 670,370 630,375 L560,380 C520,420 470,440 420,445 C340,452 262,442 236,402 C222,378 228,352 250,342 C215,350 170,348 140,330 Z"/><path transform="translate(305,386) rotate(-12)" d="M-26,0 C-18,-17 14,-19 26,-2 C19,14 -14,17 -26,0 Z" fill="#ff7a1a" stroke="#a8410a" stroke-width="2" filter="url(#glow)"/></g><text x="470" y="812" class="small" text-anchor="middle"><tspan x="470" dy="0em">location: medial temporal lobe</tspan></text></svg>